<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Maryann ❤️</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Base Theme Configuration */
            --theme-accent: #0077b6;
            --soft-blue: #90e0ef;
            --sky-blue: #e0f2fe;
            --royal-white: #ffffff;
            --text-dark: #03045e;
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: 2px solid rgba(144, 224, 239, 0.6);
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            /* 🖋️ Integrated Playful Body Font */
            font-family: 'Quicksand', sans-serif;
            color: var(--text-dark); overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 📸 High-Clarity Background Engine */
        .bg-slide {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center;
            z-index: -2; opacity: 0; transition: opacity 1.2s ease-in-out;
            transform: scale(1.02);
        }
        .bg-active { opacity: 1; transform: scale(1); transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out; }

        .page-tint {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(1px); z-index: -1;
        }

        /* Step 1: Entry Proposal Frame */
        #proposal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #caf0f8 0%, #a2d2ff 100%);
            z-index: 1000; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .proposal-box {
            background: var(--royal-white); padding: 40px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(3, 4, 94, 0.15); border: 2px solid var(--soft-blue); max-width: 420px; width: 90%;
        }

        /* Main Workspace Container */
        #main-content {
            opacity: 0; display: none; height: 100vh; width: 100vw;
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease; position: relative;
        }

        header { text-align: center; margin-bottom: 20px; z-index: 5; }
        header h1 { 
            font-family: 'Dancing Script', cursive; /* 🥰 Handwriting Calligraphy Override */
            color: #0077b6; font-size: 3.8em; margin: 0; transition: color 0.4s; 
        }
        header p { font-style: italic; color: #4361ee; font-size: 1.2em; margin: 6px 0 0; font-weight: 700; }

        /* 💌 CONSOLIDATED GLASS WINDOW HUB */
        .glass-hub {
            background: var(--glass); backdrop-filter: blur(12px);
            border: var(--glass-border); border-radius: 24px;
            padding: 30px; width: 90%; max-width: 600px;
            box-shadow: 0 15px 35px rgba(3, 4, 94, 0.08);
            transition: all 0.4s ease; text-align: center; z-index: 10;
        }

        .hub-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .tab-trigger { 
            font-family: 'Quicksand', sans-serif;
            background: var(--royal-white); border: 2px solid #ddd; color: #555; 
            padding: 12px; border-radius: 14px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s ease; font-size: 0.95em; 
        }
        
        /* Interactive State Tab Overrides */
        .tab-trigger.active-reminders { color: white; background: #ff7096; border-color: #ff7096; box-shadow: 0 4px 12px rgba(255, 112, 150, 0.3); }
        .tab-trigger.active-reasons { color: white; background: #0077b6; border-color: #0077b6; box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3); }
        .tab-trigger.active-goals { color: white; background: #38b000; border-color: #38b000; box-shadow: 0 4px 12px rgba(56, 176, 0, 0.3); }
        .tab-trigger.active-playlist { color: white; background: #ffaa00; border-color: #ffaa00; box-shadow: 0 4px 12px rgba(255, 170, 0, 0.3); }

        .display-window { min-height: 100px; font-weight: 700; font-size: 1.25em; line-height: 1.6; display: flex; align-items: center; justify-content: center; padding: 10px; }

        /* Dynamic Quiz Step Containers */
        .interactive-quiz-step {
            position: absolute; display: none; opacity: 0;
            width: 90%; max-width: 550px; z-index: 15;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(15px);
        }
        .quiz-active { display: block; opacity: 1; transform: translateY(0); }

        /* Multi-Colored Question Card Base styling */
        .question-card {
            background: var(--royal-white); border-radius: 24px; padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border-width: 3px; border-style: dashed; transition: border-color 0.4s;
        }
        .question-card label { display: block; font-weight: bold; font-size: 1.3em; margin-bottom: 20px; line-height: 1.5; }
        
        .question-card input, .question-card textarea {
            font-family: 'Quicksand', sans-serif;
            width: 100%; padding: 14px; border-radius: 14px; border: 2px solid #ccc; box-sizing: border-box; font-size: 1.05em; outline: none; transition: 0.3s;
        }

        /* Typography Highlights */
        .script-heading { font-family: 'Dancing Script', cursive; font-size: 2.6em; margin: 0 0 10px; }

        /* Dynamic System Colors */
        .btn { font-family: 'Quicksand', sans-serif; padding: 12px 32px; border-radius: 30px; font-weight: bold; font-size: 1em; cursor: pointer; border: none; transition: all 0.2s ease; outline: none; }
        .btn-theme { background: var(--theme-accent); color: white; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
        .btn-theme:hover { transform: scale(1.03); }
        
        #no-btn { position: absolute; transition: all 0.2s ease; }
        #activation-deck { margin-top: 25px; z-index: 5; }

        .floating-element { position: absolute; pointer-events: none; animation: floatUp 2.5s ease-out forwards; z-index: 2000; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.6); opacity: 1; } 100% { transform: translateY(-140px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="bg-default" class="bg-slide bg-active" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1600&auto=format&fit=crop');"></div>
    <div id="bg-q1" class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop');"></div>
    <div id="bg-q2" class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?q=80&w=1600&auto=format&fit=crop');"></div>
    <div id="bg-q3" class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1510784722466-f2aa9c52fff6?q=80&w=1600&auto=format&fit=crop');"></div>
    <div id="bg-success" class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1490730141103-6cac27aaab94?q=80&w=1600&auto=format&fit=crop');"></div>

    <div class="page-tint"></div>

    <div id="proposal-overlay">
        <div class="proposal-box">
            <h2 class="script-heading" style="color: #0077b6;">To Maryann, 🌹</h2>
            <h3 style="font-size: 1.4em; color: var(--text-dark); margin-bottom: 30px;">
                Will you be My girlfriend?<br><span style="font-size: 0.9em; color: #4361ee; font-family: 'Dancing Script', cursive;">- Mickey</span>
            </h3>
            <div style="display: flex; justify-content: center; gap: 30px; position: relative; height: 50px;">
                <button class="btn btn-theme" style="width: 100px; background: #0077b6;" onclick="acceptProposal(event)">Yes! 💙</button>
                <button class="btn btn-theme" id="no-btn" style="width: 100px; background: #7209b7;" onmouseover="escapeNoButton()">No</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1 id="main-title">To Maryann 💙</h1>
            <p>Every single note here was programmed with you in mind.</p>
        </header>

        <div class="glass-hub" id="central-message-window">
            <div class="hub-tabs">
                <button class="tab-trigger active-reminders" id="tab-reminders" onclick="toggleHubTab('reminders')">Daily Reminders ✨</button>
                <button class="tab-trigger" id="tab-reasons" onclick="toggleHubTab('reasons')">Reasons Why 🌊</button>
                <button class="tab-trigger" id="tab-goals" onclick="toggleHubTab('goals')">Future Goals ✈️</button>
                <button class="tab-trigger" id="tab-playlist" onclick="toggleHubTab('playlist')">Our Playlist 🎵</button>
            </div>
            <div class="display-window" id="hub-display-text">
                Welcome, Maryann. Click any tab above to cycle through Mickey's notes...
            </div>
            <div style="margin-top: 15px;">
                <button class="btn btn-theme" id="hub-next-btn" style="background: #ff7096;" onclick="rotateHubMessages(event)">Next Insight 📋</button>
            </div>
        </div>

        <div id="activation-deck">
            <button class="btn btn-theme" style="font-size: 1.15em; padding: 14px 45px; background: #7209b7;" onclick="engageInteractiveQuiz(event)">Unlock My Curiosity 🧩</button>
        </div>

        <div class="interactive-quiz-step" id="step-wrapper-1">
            <form class="individual-form-segment">
                <div class="question-card" id="card-style-1">
                    <label id="label-q1" for="input-q1">Loading Question...</label>
                    <input type="text" id="input-q1" name="Question 1 Answer" placeholder="Your response..." required>
                    <div style="margin-top: 25px;">
                        <button type="button" class="btn btn-theme" id="btn-q1" onclick="shiftStep(2, 'bg-q2', event)">Next Question ➡️</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="interactive-quiz-step" id="step-wrapper-2">
            <form class="individual-form-segment">
                <div class="question-card" id="card-style-2">
                    <label id="label-q2" for="input-q2">Loading Question...</label>
                    <textarea id="input-q2" name="Question 2 Answer" rows="3" placeholder="Tell me more..." required></textarea>
                    <div style="margin-top: 25px;">
                        <button type="button" class="btn btn-theme" id="btn-q2" onclick="shiftStep(3, 'bg-q3', event)">Next Question ➡️</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="interactive-quiz-step" id="step-wrapper-3">
            <form id="grand-master-form" action="https://formspree.io/f/xvzyobev" method="POST">
                
                <input type="hidden" id="hidden-q1-label" name="Question 1 Topic">
                <input type="hidden" id="hidden-q1-val" name="Answer 1">
                <input type="hidden" id="hidden-q2-label" name="Question 2 Topic">
                <input type="hidden" id="hidden-q2-val" name="Answer 2">
                <input type="hidden" id="hidden-q3-label" name="Question 3 Topic">

                <div class="question-card" id="card-style-3">
                    <label id="label-q3" for="input-q3">Loading Question...</label>
                    <input type="text" id="input-q3" name="Answer 3" placeholder="Final thoughts..." required>
                    <div style="margin-top: 25px;">
                        <button type="submit" class="btn btn-theme" id="btn-q3" style="width: 100%;">Lock In & Send Answers 🚀</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="interactive-quiz-step" id="step-wrapper-4">
            <div class="question-card" id="success-card-layout" style="border: 3px solid #38b000; background: rgba(255, 255, 255, 0.98);">
                <h2 id="success-headline" class="script-heading" style="color: #38b000;">Sent to Mickey! 💖</h2>
                <p id="success-paragraph" style="font-size: 1.15em; line-height: 1.6; font-weight: 700; color: #222;">
                    Placeholder Text
                </p>
                <div style="margin-top: 25px;">
                    <button class="btn btn-theme" style="background: #0077b6;" onclick="returnToHomeBase(event)">Back to Home Base ❤️</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const messageDatabase = {
            reminders: {
                color: "#ff7096", title: "To Maryann ✨",
                data: [
                    "You are breathtakingly beautiful, Maryann, inside and out.",
                    "Your laugh completely resets my bad days and turns them beautiful.",
                    "You have the kindest, most gorgeous soul I've ever known.",
                    "Just thinking about your smile makes my entire day brighter."
                ]
            },
            reasons: {
                color: "#0077b6", title: "Why You? 🌊",
                data: [
                    "I love how completely comfortable and safe I feel whenever I talk to you.",
                    "The way your eyes look when you are happy is my absolute favorite view.",
                    "You bring out a version of me that is happier, kinder, and stronger.",
                    "Because out of billions of people, my heart chose you automatically."
                ]
            },
            goals: {
                color: "#38b000", title: "Our Future ✈️",
                data: [
                    "Taking a long evening beach walk with you without worrying about the time.",
                    "Building an incredible, successful future while keeping you smiling.",
                    "Exploring beautiful new places together and making lifelong memories.",
                    "Achieving huge milestones and having you right by my side to celebrate."
                ]
            },
            playlist: {
                color: "#ffaa00", title: "Melodies For You 🎵",
                data: [
                    "Every sweet love song soundtrack feels like it was written about you.",
                    "Hearing your favorite music instantly shifts my mood to pure joy.",
                    "I want to make a private playlist of songs that define our story.",
                    "Your voice is honestly the most calming melody in my entire life."
                ]
            }
        };

        // Complete robust question bank pool for infinite variation
        const questionPool = [
            { text: "If Mickey surprised you right now with a dream getaway trip, where are we escaping to? 🗺️", color: "#7209b7" },
            { text: "What is your absolute favorite, sweetest memory of us so far? 🥺", color: "#b5179e" },
            { text: "Is there a specific song that makes you think of Mickey when it plays? 🎵", color: "#4cc9f0" },
            { text: "What is your definition of a perfect, cozy date night together? 🍕", color: "#f72585" },
            { text: "What small thing does Mickey do that never fails to make you smile? 🙈", color: "#3a0ca3" },
            { text: "If we could pick an absolute dream hobby to learn together, what would it be? 🎨", color: "#480ca8" },
            { text: "What is one dream milestone you want us to smash together this year? 🌟", color: "#560bad" },
            { text: "What is a food or dessert you want us to go try out very soon? 🍨", color: "#ff006e" }
        ];

        // 👑 FRESH VARIABLE POOL FOR POPUP WRAP-UP SCREENS WITH HEAVY EMOJIS
        const dynamicSuccessMessages = [
            {
                headline: "Sent to Mickey! 💌🌟✨",
                text: "Yaaay! 🎉💃 You did it, Maryann! Your incredibly beautiful responses just flew straight into my inbox! 🚀📬 Honestly, learning these little custom details about you makes my heart skip beats! 💓🫣 I'm literally smiling like crazy over here! 😍 can't wait to read every single word! 👩‍❤️‍👨✨",
                borderColor: "#ff7096"
            },
            {
                headline: "Locked & Loaded! 🔐💞💎",
                text: "Omg thank youuu! 😭🫶 Your sweet answers are safe with me now! 🗃️✨ Every time you answer these, it feels like adding another perfect chapter to our puzzle! 🧩💫 You are literally my absolute favorite person to discover! 🌍❤️ Stay beautiful, my queen! 👑✨🤭",
                borderColor: "#7209b7"
            },
            {
                headline: "Inbox Exploded! 💥❤️🔥",
                text: "Alert! 🚨 Mickey's phone just lit up completely! 📱✨ Maryann has successfully deployed some pure sweetness directly to my screen! 🥰🛸 Thank you for sharing your thoughts with me, gorgeous! ✨🌾 Processing your answers with maximum love right now! 🧠❤️😘",
                borderColor: "#38b000"
            },
            {
                headline: "Mission Complete! 🏹💖🌸",
                text: "Bullseye! 🎯💘 You just completed the mystery deck! 🃏✨ Your gorgeous insights have landed smoothly! 🛬💨 I absolutely adore how your mind works, Maryann! 🧠💭✨ Now go back out to the main hub and keep enjoying your special domain! 🏰💙✨",
                borderColor: "#ffaa00"
            }
        ];

        const indices = { reminders: 0, reasons: 0, goals: 0, playlist: 0 };
        let activeTab = 'reminders';
        let currentFormStep = 0;
        let activeQuizQuestions = [];

        function escapeNoButton() {
            const noBtn = document.getElementById('no-btn');
            noBtn.style.transform = `translate(${Math.floor((Math.random() - 0.5) * 200)}px, ${Math.floor((Math.random() - 0.5) * 120)}px)`;
        }

        function acceptProposal(e) {
            for(let i=0; i<15; i++) {
                setTimeout(() => createFloating(e.clientX + (Math.random()-0.5)*150, e.clientY + (Math.random()-0.5)*150), i*50);
            }
            document.getElementById('proposal-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('proposal-overlay').style.visibility = 'hidden';
                const main = document.getElementById('main-content');
                main.style.display = 'flex';
                setTimeout(() => { main.style.opacity = '1'; }, 50);
                rotateHubMessages(e);
            }, 600);
        }

        /* 💌 Dynamic Color Tab Switching System */
        function toggleHubTab(tabName) {
            if(activeTab === tabName) return;
            activeTab = tabName;
            
            document.querySelectorAll('.tab-trigger').forEach(btn => {
                btn.className = 'tab-trigger'; 
            });
            document.getElementById(`tab-${tabName}`).classList.add(`active-${tabName}`);
            
            const targetedColor = messageDatabase[tabName].color;
            document.getElementById('main-title').innerText = messageDatabase[tabName].title;
            document.getElementById('main-title').style.color = targetedColor;
            document.getElementById('hub-next-btn').style.backgroundColor = targetedColor;
            
            document.getElementById('hub-display-text').innerText = "Click 'Next Insight' to view notes...";
        }

        function rotateHubMessages(event) {
            const currentTabConfig = messageDatabase[activeTab];
            const list = currentTabConfig.data;
            const idx = indices[activeTab];
            document.getElementById('hub-display-text').innerText = list[idx];
            indices[activeTab] = (idx + 1) % list.length;
            createFloating(event.clientX, event.clientY);
        }

        /* 🧩 Quiz Sequence Engine with Variable Selection */
        function engageInteractiveQuiz(event) {
            document.getElementById('central-message-window').style.opacity = 0;
            document.getElementById('activation-deck').style.opacity = 0;

            const shuffled = [...questionPool].sort(() => 0.5 - Math.random());
            activeQuizQuestions = shuffled.slice(0, 3);

            for(let i = 1; i <= 3; i++) {
                const qConfig = activeQuizQuestions[i-1];
                document.getElementById(`label-q${i}`).innerText = qConfig.text;
                document.getElementById(`label-q${i}`).style.color = qConfig.color;
                document.getElementById(`card-style-${i}`).style.borderColor = qConfig.color;
                
                const processBtn = document.getElementById(`btn-q${i}`);
                if (processBtn) processBtn.style.backgroundColor = qConfig.color;
                
                document.getElementById(`input-q${i}`).value = '';
            }

            setTimeout(() => {
                document.getElementById('central-message-window').style.display = 'none';
                document.getElementById('activation-deck').style.display = 'none';
                
                changeBackground('bg-q1');
                document.getElementById('step-wrapper-1').classList.add('quiz-active');
                currentFormStep = 1;
            }, 450);

            createFloating(event.clientX, event.clientY);
        }

        function shiftStep(nextTargetStep, targetBackgroundImageId, event) {
            const wrapper = document.getElementById(`step-wrapper-${currentFormStep}`);
            const currentField = wrapper.querySelector('input, textarea');
            
            if (currentField && !currentField.value.trim()) {
                currentField.style.borderColor = 'red';
                currentField.focus();
                return;
            } else if (currentField) {
                currentField.style.borderColor = '#ccc';
            }

            wrapper.classList.remove('quiz-active');
            changeBackground(targetBackgroundImageId);

            setTimeout(() => {
                document.getElementById(`step-wrapper-${nextTargetStep}`).classList.add('quiz-active');
                currentFormStep = nextTargetStep;
            }, 450);

            createFloating(event.clientX, event.clientY);
        }

        function changeBackground(targetId) {
            document.querySelectorAll('.bg-slide').forEach(slide => slide.classList.remove('bg-active'));
            document.getElementById(targetId).classList.add('bg-active');
        }

        function createFloating(x, y) {
            const pool = ['💖', '💙', '✨', '🌸', '🎵'];
            const el = document.createElement('div');
            el.innerHTML = pool[Math.floor(Math.random() * pool.length)];
            el.classList.add('floating-element');
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            el.style.fontSize = `${Math.random() * 15 + 15}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        /* 🚀 Close Love Loop Reset Engine */
        function returnToHomeBase(event) {
            document.getElementById('step-wrapper-4').classList.remove('quiz-active');
            changeBackground('bg-default');
            
            setTimeout(() => {
                document.getElementById('central-message-window').style.display = 'block';
                document.getElementById('activation-deck').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('central-message-window').style.opacity = 1;
                    document.getElementById('activation-deck').style.opacity = 1;
                }, 50);
                toggleHubTab('reminders');
            }, 450);
            
            createFloating(window.innerWidth/2, window.innerHeight/2);
        }

        /* Form Collector Interceptor */
        const masterForm = document.getElementById('grand-master-form');
        masterForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitTrigger = document.getElementById('btn-q3');
            submitTrigger.innerText = "Sending to Mickey... 🔒";
            submitTrigger.disabled = true;

            document.getElementById('hidden-q1-label').value = activeQuizQuestions[0].text;
            document.getElementById('hidden-q1-val').value = document.getElementById('input-q1').value;
            document.getElementById('hidden-q2-label').value = activeQuizQuestions[1].text;
            document.getElementById('hidden-q2-val').value = document.getElementById('input-q2').value;
            document.getElementById('hidden-q3-label').value = activeQuizQuestions[2].text;

            const payload = new FormData(masterForm);

            try {
                const response = await fetch(masterForm.action, {
                    method: 'POST',
                    body: payload,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    // 🎲 SELECT A COMPLETELY RANDOM EMOJI CARD ON RE-ENTRY
                    const randomPopup = dynamicSuccessMessages[Math.floor(Math.random() * dynamicSuccessMessages.length)];
                    
                    document.getElementById('success-headline').innerText = randomPopup.headline;
                    document.getElementById('success-paragraph').innerText = randomPopup.text;
                    document.getElementById('success-card-layout').style.borderColor = randomPopup.borderColor;

                    document.getElementById('step-wrapper-3').classList.remove('quiz-active');
                    changeBackground('bg-success');
                    setTimeout(() => {
                        document.getElementById('step-wrapper-4').classList.add('quiz-active');
                    }, 450);
                } else {
                    submitTrigger.innerText = "Submission Error 🥺";
                    submitTrigger.disabled = false;
                }
            } catch (error) {
                submitTrigger.innerText = "Network Error 🥺";
                submitTrigger.disabled = false;
            }
        });
    </script>
</body>
</html>
